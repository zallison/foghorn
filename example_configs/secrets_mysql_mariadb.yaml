# Example: secrets split across inline + MySQL backends.
#
# Populate the MySQL table with TSIG/DNSSEC rows (or use put() / admin tooling).
# Inline backend holds the local admin token for a quick start.

server:
  listen:
    udp:
      enabled: true
      host: 127.0.0.1
      port: 5353
  resolver:
    mode: forward
  http:
    enabled: true
    host: 127.0.0.1
    port: 5380
    enable_api: true
    auth:
      mode: token
      token_secret: { id: local-inline, key: admin-api }

upstreams:
  endpoints:
    - host: 1.1.1.1
      port: 53

secrets:
  backends:
    - id: local-inline
      module: inline
      config:
        entries:
          - id: admin-api
            kind: token
            token: "change-me"
    - id: tsig-db
      module: mysql
      abort_on_failure: false   # set true in production once DB is ready
      config:
        host: 127.0.0.1
        port: 3306
        user: foghorn
        password: ${DB_PASSWORD}
        database: foghorn_secrets
        table: secrets
        driver: auto

plugins:
  - type: zone_records
    config:
      # dnssec_signing:
      #   secrets:
      #     backend: tsig-db
      #   keys_dir: ./keys/dnssec
      #   generate: maybe
      zones: []
