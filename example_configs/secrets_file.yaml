# Example: inline + file secrets backends (TSIG, admin token, optional TLS paths).
#
# - module: inline  holds tokens/TSIG secrets embedded in config
# - module: file    is path-backed only (cert_file/value_file/...)
#
# Run:
#   foghorn config validate -c example_configs/secrets_file.yaml
#   foghorn serve -c example_configs/secrets_file.yaml

variables:
  DOMAIN: example.com

server:
  listen:
    udp:
      enabled: true
      host: 127.0.0.1
      port: 5353
  resolver:
    mode: forward
  http:
    enabled: true
    host: 127.0.0.1
    port: 5380
    enable_api: true
    auth:
      mode: token
      # Resolve from secrets backend instead of inline token:
      token_secret: { id: local-inline, key: admin-api }
    # Optional TLS from secrets (separate keys for cert vs private key):
    # cert_secret: { id: local-files, key: server1-tls-cert-secret }
    # key_secret:  { id: local-files, key: server1-tls-secret }
  features:
    tsig:
      enabled: true
      mode: optional
      key_sources:
        - type: secrets
          id: local-inline
          key: query-tsig

upstreams:
  endpoints:
    - host: 1.1.1.1
      port: 53

secrets:
  backends:
    # In-config tokens/TSIG secrets belong on module: inline (not file).
    - id: local-inline
      module: inline
      config:
        entries:
          - id: admin-api
            kind: token
            token: "change-me"
          - id: query-tsig
            kind: tsig
            name: "query.${DOMAIN}."
            algorithm: hmac-sha256
            # base64("test-secret")
            secret: "dGVzdC1zZWNyZXQ="
    # Path-backed TLS (and value_file tokens) use module: file only.
    - id: local-files
      module: file
      config:
        # entries:
        #   - id: admin-tls
        #     kind: tls
        #     cert_file: ./keys/admin.crt
        #     key_file: ./keys/admin.key
        entries: []
