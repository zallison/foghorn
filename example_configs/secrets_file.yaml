# Example: file-backed secrets with TSIG + admin token + TLS refs.
#
# Paths are relative to the config file directory when Foghorn resolves TLS;
# secret entry paths below are absolute-or-CWD relative for the file backend.

variables:
  DOMAIN: example.com

server:
  listen:
    udp:
      enabled: true
      host: 127.0.0.1
      port: 5353
  resolver:
    mode: forward
  http:
    enabled: true
    host: 127.0.0.1
    port: 5380
    enable_api: true
    auth:
      mode: token
      # Resolve from secrets backend instead of inline token:
      token_secret: { id: local-files, key: admin-api }
    # Optional TLS from secrets (separate keys for cert vs private key):
    # cert_secret: { id: local-files, key: server1-tls-cert-secret }
    # key_secret:  { id: local-files, key: server1-tls-secret }
  features:
    tsig:
      enabled: true
      mode: optional
      key_sources:
        - type: secrets
          id: local-files
          key: query-tsig

upstreams:
  endpoints:
    - host: 1.1.1.1
      port: 53

secrets:
  backends:
    - id: local-files
      module: file
      config:
        entries:
          - id: admin-api
            kind: token
            # Prefer value_file in production:
            token: "change-me"
          - id: query-tsig
            kind: tsig
            name: "query.${DOMAIN}."
            algorithm: hmac-sha256
            # base64("test-secret")
            secret: "dGVzdC1zZWNyZXQ="
          # - id: admin-tls
          #   kind: tls
          #   cert_file: ./keys/admin.crt
          #   key_file: ./keys/admin.key
