# Example job: secrets backends + enable_tls + admin API auth.
#
# Demonstrates:
#   - module: inline  for in-config tokens / PEMs
#   - module: file    for path-backed material only
#   - enable_tls      (explicit) with generate=maybe self-signed admin certs
#   - token_secret    so enable_api is authenticated
#
# Run (from repo root, venv active):
#   make env-dev && source ./venv/bin/activate
#   foghorn config validate -c example_configs/secrets_enable_tls.yaml
#   foghorn serve -c example_configs/secrets_enable_tls.yaml
#
# Health check (after start):
#   curl -sk -H "Authorization: Bearer change-me-admin-token" \
#     https://127.0.0.1:15380/health
#
# DNS smoke (after start):
#   dig @127.0.0.1 -p 15353 example.com +short
#
# Notes:
#   - UDP/TCP DNS on 15353 (high ports; no root needed).
#   - Admin HTTPS on 15380; certs land under example_configs/keys/ when generated.
#   - enable_tls is set; omitting it still enables TLS once cert material exists.

variables:
  DOMAIN: example.local

logging:
  python:
    level: info
    stderr: true

server:
  listen:
    udp:
      enabled: true
      host: 127.0.0.1
      port: 15353
    tcp:
      enabled: true
      host: 127.0.0.1
      port: 15353
    dot:
      enabled: false
    doh:
      enabled: false
  resolver:
    mode: forward
    timeout_ms: 2000
  http:
    enabled: true
    host: 127.0.0.1
    port: 15380
    enable_api: true
    enable_admin: true
    # Explicit flag (aliases: true/yes/enabled). Unset still enables TLS when
    # certs/secrets/generate provide material. enable_tls: false with certs fails.
    enable_tls: true
    generate: maybe
    keys_dir: ./keys
    auth:
      mode: token
      token_secret: { id: inline-secrets, key: admin-api }
    # Optional Basic auth instead of token:
    # auth:
    #   mode: basic
    #   username: admin
    #   password_secret: { id: inline-secrets, key: admin-basic-password }

upstreams:
  strategy: failover
  endpoints:
    - host: 1.1.1.1
      port: 53
    - host: 8.8.8.8
      port: 53

secrets:
  backends:
    # In-config material only (token/secret/PEM strings). No path fields.
    - id: inline-secrets
      module: inline
      config:
        entries:
          - id: admin-api
            kind: token
            token: "change-me-admin-token"
          - id: admin-basic-password
            kind: token
            token: "change-me-basic-password"
          - id: query-tsig
            kind: tsig
            name: "query.${DOMAIN}."
            algorithm: hmac-sha256
            # base64("test-secret")
            secret: "dGVzdC1zZWNyZXQ="

    # Path-backed only. Uncomment once files exist under example_configs/keys/.
    # - id: local-files
    #   module: file
    #   config:
    #     root: .
    #     entries:
    #       - id: admin-tls
    #         kind: tls
    #         cert_file: ./keys/foghorn_admin.crt
    #         key_file: ./keys/foghorn_admin.key

plugins: []
